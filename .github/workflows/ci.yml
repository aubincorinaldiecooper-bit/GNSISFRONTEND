name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  auth-service:
    name: Auth service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth-service
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: auth-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  frontend-container:
    name: Frontend container smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Build production image
        run: docker build -t gnsis-frontend:ci GNSIS

      - name: Start container with runtime config
        run: |
          docker run -d --name gnsis-fe -p 8080:8080 \
            -e VITE_API_BASE_URL='https://api.gnsis.test' \
            -e VITE_AUTH_URL='https://auth.gnsis.test' \
            -e VITE_GITHUB_APP_SLUG='gnsis-app' \
            -e VITE_ENABLE_INTEGRATION_LAB='false' \
            gnsis-frontend:ci

      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health >/dev/null 2>&1; then
              echo "healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "container did not become healthy"; docker logs gnsis-fe; exit 1

      - name: /health returns 200
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/health)
          echo "GET /health -> $code"; test "$code" = "200"

      - name: /env.js is valid JS, no-store, and carries the runtime values
        run: |
          curl -sD headers.txt http://localhost:8080/env.js -o env.js
          echo "--- headers ---"; cat headers.txt
          grep -iq '^cache-control:[[:space:]]*no-store' headers.txt || {
            echo "missing Cache-Control: no-store on /env.js"; exit 1; }
          # Must be syntactically valid JavaScript.
          node --check env.js
          # Runtime values must be present and win over the (empty) build-time bundle.
          node -e "global.window={};require('./env.js');const c=global.window.__GNSIS_CONFIG__;
            if(c.VITE_API_BASE_URL!=='https://api.gnsis.test')throw new Error('api base missing: '+JSON.stringify(c));
            if(c.VITE_AUTH_URL!=='https://auth.gnsis.test')throw new Error('auth url missing');
            if(c.VITE_ENABLE_INTEGRATION_LAB!=='false')throw new Error('flag missing');
            console.log('env.js ok:', JSON.stringify(c));"

      - name: Nested routes return index.html (SPA fallback)
        run: |
          for path in "/settings" "/dashboard" "/runs/example-id" "/onboarding/github?installation_id=123"; do
            body=$(curl -s "http://localhost:8080${path}")
            echo "$body" | grep -q '<div id="root">' || { echo "no SPA fallback for ${path}"; exit 1; }
            echo "SPA fallback ok: ${path}"
          done

      # "/" is the live page, forwarded to the runtime (see Caddyfile), so the
      # bundle's index.html is read from a path the bundle still owns.
      - name: Real JS asset is served (not index.html)
        run: |
          index=$(curl -s http://localhost:8080/login)
          asset=$(echo "$index" | grep -oE '/assets/[^"]+\.js' | head -1)
          test -n "$asset" || { echo "no JS asset referenced by index.html"; exit 1; }
          ct=$(curl -s -o body.js -D - "http://localhost:8080${asset}" | grep -i '^content-type:' | tr -d '\r')
          echo "${asset} -> ${ct}"
          echo "$ct" | grep -qiE 'javascript|ecmascript' || { echo "asset not served as JS"; exit 1; }
          grep -q '<div id="root">' body.js && { echo "asset fell through to index.html"; exit 1; } || true

      - name: Real CSS asset is served where present
        run: |
          index=$(curl -s http://localhost:8080/login)
          css=$(echo "$index" | grep -oE '/assets/[^"]+\.css' | head -1 || true)
          if [ -n "$css" ]; then
            ct=$(curl -s -o /dev/null -w '%{content_type}' "http://localhost:8080${css}")
            echo "${css} -> ${ct}"; echo "$ct" | grep -qi 'css' || { echo "css not served as text/css"; exit 1; }
          else
            echo "no stylesheet asset emitted (acceptable)"
          fi

      - name: The live surface is served locally and never waits on the runtime
        run: |
          # The whole point of this split: the page and everything it loads come
          # from this container, so a visitor never waits on a GPU cold start.
          # GNSIS_LIVE_UPSTREAM is unset here, so anything that reached the proxy
          # would answer 502 — these must not.
          for path in "/" "/live" "/live/qr.svg" "/assets/live.css" "/assets/live.js" \
                      "/assets/mic-worklet.js" "/assets/live/gnsis-mark.svg" \
                      "/assets/live/orbit.svg" "/assets/live/Roboto.woff2" \
                      "/assets/live/torph.mjs" "/assets/live/web-haptics.mjs"; do
            code=$(curl -s -o local.out -w '%{http_code}' "http://localhost:8080${path}")
            echo "GET ${path} -> ${code}"
            test "$code" = "200" || { echo "${path} did not return 200"; exit 1; }
            grep -q '<div id="root">' local.out && { echo "${path} fell through to the SPA"; exit 1; } || true
          done

      - name: The front door is the live page, with both doors in it
        run: |
          curl -s http://localhost:8080/ -o door.html
          grep -q 'Let it see what you see.' door.html || { echo "front door is not the live page"; exit 1; }
          # A QR is useless on the device you would scan it with, so both the
          # code and the start button ship in the markup; CSS picks by pointer.
          grep -q 'Scan with your phone' door.html || { echo "no QR door in the page"; exit 1; }
          grep -q 'id="start"' door.html || { echo "no start button in the page"; exit 1; }
          # The page must not promise a session before the server confirms one.
          grep -q 'Session ready' door.html && { echo "'Session ready' must not be in the markup"; exit 1; } || true
          # /live serves the same page.
          curl -s http://localhost:8080/live -o live.html
          cmp -s door.html live.html || { echo "/ and /live differ"; exit 1; }
          echo "front door ok"

      - name: The QR encodes this site, not the runtime
        run: |
          ct=$(curl -s -o qr.svg -w '%{content_type}' http://localhost:8080/live/qr.svg)
          echo "/live/qr.svg -> ${ct}"
          echo "$ct" | grep -qi 'svg' || { echo "QR not served as SVG"; exit 1; }
          grep -q 'gnsis.studio/live' qr.svg || { echo "QR does not target this site"; exit 1; }
          # A QR is photographed and passed around: it must carry no secrets.
          grep -qiE 'token|key|secret|password|[?#]' qr.svg && { echo "QR carries a query, fragment or secret"; exit 1; } || true

      - name: Only the sockets are forwarded to the runtime
        run: |
          # With no upstream configured the proxy answers 502. That is the proof
          # the request was forwarded at all, rather than served from the bundle.
          for path in "/ws/duplex" "/ws/screen"; do
            code=$(curl -s -o fwd.out -w '%{http_code}' "http://localhost:8080${path}")
            echo "GET ${path} -> ${code}"
            test "$code" = "502" || { echo "expected 502 from the unset upstream for ${path}, got ${code}"; exit 1; }
            grep -q '<div id="root">' fwd.out && { echo "${path} was served from the bundle"; exit 1; } || true
          done
          # And a hashed bundle asset must never be forwarded.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/assets/index-not-a-real-hash.js)
          echo "GET /assets/index-not-a-real-hash.js -> ${code}"
          test "$code" != "502" || { echo "bundle asset path was forwarded to the runtime"; exit 1; }

      - name: The vendored live surface still matches what the page asks for
        run: |
          # Every path live.html and live.js request must exist. A half-finished
          # re-copy from the backend fails here rather than in production.
          curl -s http://localhost:8080/live -o page.html
          missing=0
          for ref in $(grep -oE '(src|href)="/[^"]+"' page.html | cut -d'"' -f2 | sort -u); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080${ref}")
            echo "  referenced ${ref} -> ${code}"
            test "$code" = "200" || missing=1
          done
          # live.js loads these at runtime rather than from the markup.
          for ref in /assets/live/web-haptics.mjs /assets/live/torph.mjs /assets/mic-worklet.js; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080${ref}")
            echo "  imported ${ref} -> ${code}"
            test "$code" = "200" || missing=1
          done
          test "$missing" = "0" || { echo "the live surface is incomplete"; exit 1; }

      - name: Unsafe characters do not break the generated /env.js
        run: |
          docker rm -f gnsis-fe >/dev/null 2>&1 || true
          VAL="$(printf 'a"b\\c\td\ne-end')"   # quote, backslash, tab, newline
          docker run -d --name gnsis-fe-unsafe -p 8081:8080 \
            -e VITE_GITHUB_APP_SLUG="$VAL" gnsis-frontend:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8081/health >/dev/null 2>&1 && break; sleep 1; done
          curl -s http://localhost:8081/env.js -o env-unsafe.js
          cat env-unsafe.js
          node --check env-unsafe.js   # would fail if escaping were broken
          node -e "global.window={};require('./env-unsafe.js');
            const s=global.window.__GNSIS_CONFIG__.VITE_GITHUB_APP_SLUG;
            if(typeof s!=='string')throw new Error('slug not a string');
            console.log('unsafe slug preserved, length='+s.length);"

      - name: Dump container logs on failure
        if: failure()
        run: |
          docker logs gnsis-fe 2>&1 || true
          docker logs gnsis-fe-unsafe 2>&1 || true

  react-frontend:
    name: React frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GNSIS
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: GNSIS/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
